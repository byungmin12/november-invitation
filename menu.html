function paintFold(distance){
 if(!fold)return;const f=fold;f.progress=distance;
 if(f.mode==='return'){
 const remaining=Math.max(0,1-distance/f.extent),travel=Math.abs(f.nx)*f.w+Math.abs(f.ny)*f.h+28;
 f.layer.style.transform=`translate3d(${f.nx*remaining*travel}px,${f.ny*remaining*travel}px,0)`;
 return;
 }
 for(const b of f.bands){
 const q=b.s-f.hi+distance*.8+Math.min(distance*.25,Math.max(0,f.hi-f.start));
 const positive=Math.max(0,q),theta=Math.min(Math.PI,positive/f.radius);
 const curved=positive<=Math.PI*f.radius?f.radius*Math.sin(theta):-(positive-Math.PI*f.radius);
 const delta=curved-positive,z=f.radius*(1-Math.cos(theta));
 b.band.style.transform=`translate3d(${f.nx*delta}px,${f.ny*delta}px,${z}px) rotate3d(${f.ny},${-f.nx},0,${theta}rad)`;
 b.face.style.opacity=theta>Math.PI/2?'0':'1';
 b.band.style.background=theta>Math.PI/2?'#f7f3ec':'#fff';
 b.shade.style.background=`rgba(90,60,30,${Math.sin(theta)*.20})`;
 }
 f.layer.style.opacity=1-Math.max(0,(distance/f.extent-.83)/.17);
}
function finishFold(commit){
 if(!fold)return;turning=true;const f=fold;f.commit=commit;const from=f.progress,to=commit?f.extent:0,t0=performance.now(),duration=commit?1300:650;
 function tick(t){if(fold!==f)return;const p=Math.min(1,(t-t0)/duration),ease=1-Math.pow(1-p,3);paintFold(from+(to-from)*ease);
 if(p<1)requestAnimationFrame(tick);else{f.layer.remove();render(commit?f.target:f.old);fold=null;turning=false;}}
 requestAnimationFrame(tick);
}
function go(n){n=Math.max(0,Math.min(cards.length-1,n));if(turning||gesture||n===current)return;
 if(reduce()){render(n);return;}const r=cards[current].getBoundingClientRect(),forward=n>current;
 if(forward)makeFold(n,r.right-25,r.bottom-10,-.16,-1);else makeReturn(n,0,1);finishFold(true);
}
function step(d){if(turning||gesture)return;go(current+d)}
prev.onclick=()=>step(-1);next.onclick=()=>step(1);[...rail.children].forEach((b,i)=>b.onclick=()=>go(i));document.querySelector('#home').onclick=e=>{e.preventDefault();go(0)};
function snapFold(){const f=fold;if(!f)return;f.layer.remove();render(f.commit?f.target:f.old);fold=null;turning=false;}
deck.addEventListener('pointerdown',e=>{if(turning&&fold&&fold.commit&&fold.progress/fold.extent>=.5)snapFold();
 if(turning||gesture||!e.isPrimary||e.button!==0||e.target.closest('a'))return;const r=cards[current].getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)return;
 gesture={id:e.pointerId,x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY};deck.setPointerCapture(e.pointerId);
});
deck.addEventListener('pointermove',e=>{const g=gesture;if(!g||g.id!==e.pointerId)return;const dx=e.clientX-g.x,dy=e.clientY-g.y,len=Math.hypot(dx,dy);g.lastX=e.clientX;g.lastY=e.clientY;
 if(!fold&&len>9){const dir=(Math.abs(dy)>=Math.abs(dx)?dy:dx)<0?1:-1,target=current+dir;if(target<0||target>=cards.length)return;g.dir=dir;if(!reduce()){if(dir>0)makeFold(target,g.x,g.y,dx,dy);else makeReturn(target,dx,dy);}}
 if(fold){followDirection(dx,dy);paintFold(len);}
});
function release(e,cancel=false){const g=gesture;if(!g||g.id!==e.pointerId)return;gesture=null;
 if(fold){const threshold=(Math.abs(fold.ny)*fold.h+Math.abs(fold.nx)*fold.w)*.38;finishFold(!cancel&&fold.progress>threshold);}
 else if(!cancel&&reduce()&&g.dir&&Math.hypot(g.lastX-g.x,g.lastY-g.y)>70)render(current+g.dir);
 if(deck.hasPointerCapture(e.pointerId))deck.releasePointerCapture(e.pointerId);
}
deck.addEventListener('pointerup',e=>release(e));deck.addEventListener('pointercancel',e=>release(e,true));deck.addEventListener('lostpointercapture',e=>{if(gesture)release(e,true)});
window.addEventListener('resize',()=>{if(fold){const f=fold;fold=null;f.layer.remove();render(f.old);}gesture=null;turning=false;});
let wheelTotal=0,wheelTime=0;window.addEventListener('wheel',e=>{e.preventDefault();if(Date.now()-wheelTime>180)wheelTotal=0;wheelTime=Date.now();wheelTotal+=e.deltaY;if(Math.abs(wheelTotal)>45){step(wheelTotal>0?1:-1);wheelTotal=0}},{passive:false});window.addEventListener('keydown',e=>{if(['ArrowDown','PageDown',' ','ArrowUp','PageUp','Home','End'].includes(e.key)){e.preventDefault();if(e.key==='Home')go(0);else if(e.key==='End')go(cards.length-1);else step(['ArrowUp','PageUp'].includes(e.key)?-1:1)}});render(0);
</script></body></html>
